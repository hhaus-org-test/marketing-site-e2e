name: independent marketing acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional public origin for read-only live HTTP acceptance
        required: false
        default: https://hhaus.org
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Install exact consumer dependencies
        run: npm ci --ignore-scripts
      - name: Clone, build, and certify the immutable source revision
        run: npm run verify

  live-http:
    if: github.event_name == 'workflow_dispatch' && inputs.base_url != ''
    needs: source-acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Install exact consumer dependencies
        run: npm ci --ignore-scripts
      - name: Run read-only live HTTP acceptance
        env:
          BASE_URL: ${{ inputs.base_url }}
        run: npm run test:live
